@let copy = text();
@let item = funding();

<section class="sd-section partners-section" aria-labelledby="home-partners-title">
  <div class="sd-container">
    <sd-section-header
      [index]="index()"
      [overline]="copy.home.partnersOverline"
      [title]="copy.home.partnersTitle"
      [lead]="item.fullText || copy.home.partnersLead"
      headingId="home-partners-title"
    />
  </div>
  <!-- Full width, like the original: the curve swings edge to edge. -->
  <sd-partner-journey [funding]="item" />
</section>
