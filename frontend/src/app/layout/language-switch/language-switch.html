<div class="switch" role="group" [attr.aria-label]="languages.text().header.switchLanguage">
  @for (option of options; track option.value; let last = $last) {
    <button
      type="button"
      class="option"
      [class.is-active]="languages.language() === option.value"
      [attr.aria-pressed]="languages.language() === option.value"
      [attr.lang]="option.value"
      [attr.title]="option.name"
      (click)="languages.use(option.value)"
    >
      {{ option.short }}
    </button>
    @if (!last) {
      <span class="separator" aria-hidden="true">·</span>
    }
  }
</div>
