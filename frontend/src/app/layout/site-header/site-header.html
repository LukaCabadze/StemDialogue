<div class="bar">
  <a class="brand" [routerLink]="project.rootPath()" [attr.aria-label]="text().brand.homeLink">
    <img class="symbol" src="brand/symbol.png" alt="" width="34" height="44" />
    <span class="wordmark">
      <span class="name">{{ text().brand.name }}</span>
      <span class="tagline">{{ text().brand.tagline }}</span>
    </span>
  </a>

  <sd-main-nav class="desktop-nav" [entries]="navigation()" [label]="text().nav.mainNavigation" />

  <div class="actions">
    <sd-language-switch />
    <a class="sd-btn sd-btn--primary sd-btn--sm join" [routerLink]="joinPath()">{{ text().header.join }}</a>
    <button
      type="button"
      class="menu-button"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      [attr.aria-label]="menuOpen() ? text().nav.closeMenu : text().nav.openMenu"
      (click)="toggleMenu()"
    >
      <sd-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="22" />
    </button>
  </div>
</div>

<div id="mobile-menu" class="drawer" [class.is-open]="menuOpen()" [attr.inert]="menuOpen() ? null : ''">
  <sd-main-nav [entries]="navigation()" [label]="text().nav.mainNavigation" [stacked]="true" (navigate)="closeMenu()" />
  <a class="sd-btn sd-btn--primary sd-btn--block" [routerLink]="joinPath()">{{ text().header.join }}</a>
</div>
