# Local/standalone stack: SQL Server + one-off migration job + API.
# The Angular site (and Caddy) sits in front and proxies /api, /media and /sitemap.xml to the api service.
name: stemdialogue
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes: [sql-data:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  migrate:
    build: .
    depends_on:
      sql: { condition: service_healthy }
    environment: &api-env
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=sql;Database=StemDialogue;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=true;TrustServerCertificate=true"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Bootstrap__Email: ${BOOTSTRAP_EMAIL:-}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD:-}
      PublicSite__BaseUrl: ${PUBLIC_BASE_URL:-https://stemdialogue.com}
    command: ["--migrate"]

  api:
    build: .
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment: *api-env
    volumes: [media:/app/App_Data/media]
    ports: ["5080:8080"]
    restart: unless-stopped

volumes:
  sql-data:
  media:
